<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yu. — Library Cards</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5ef;color:#343029}*{box-sizing:border-box}body{margin:0}header{height:88px;border-bottom:1px solid #e5e0d6;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,6vw,95px)}.brand{font-family:Georgia,serif;font-size:34px;font-style:italic}.brand small{font:12px ui-sans-serif,system-ui;letter-spacing:1.7px;color:#9b8e7c;margin-left:15px;font-style:normal}main{max-width:1190px;margin:0 auto;padding:55px 26px 90px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px}h1{font:normal 43px Georgia,serif;margin:0 0 9px}.sub{color:#948779;font-size:14px;margin:0}.search{background:#fff;border:1px solid #e4ded4;border-radius:24px;padding:12px 17px;width:245px;max-width:100%;outline-color:#bfa78c}.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:35px}.sidebar{border-right:1px solid #e6e0d5;padding-right:22px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a09381;margin:0 0 17px}.filter{display:block;border:0;background:transparent;color:#6f675c;padding:11px 12px;width:100%;text-align:left;border-radius:9px;cursor:pointer;font-size:14px}.filter:hover,.filter.active{background:#eee9df}.filter span{float:right;color:#aa9d8e}.sidebar-note{font:italic 16px/1.7 Georgia,serif;color:#a99a88;margin-top:55px}.workspace{min-width:0}.workspace-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 19px}.workspace-head h2{font:normal 23px Georgia,serif;margin:0}.small{font-size:12px;color:#a99a88}.card{background:#fff;border:1px solid #e8e2d9;border-radius:15px;padding:34px 37px;box-shadow:0 12px 35px #55452f0a;max-width:780px}.card-top{display:flex;align-items:center;justify-content:space-between}.number{font-size:12px;color:#ad9d89;letter-spacing:1.4px}.edit{border:1px solid #e5ded4;background:#fff;border-radius:20px;padding:8px 14px;cursor:pointer;color:#827361}.edit:hover{background:#f6f1e8}.card h3{font:normal 29px/1.35 Georgia,"Songti SC",serif;margin:23px 0 28px}.field-label{font-size:12px;letter-spacing:1px;color:#a28d77;margin:21px 0 8px}.field-text{font-size:15px;line-height:1.85;white-space:pre-wrap;margin:0;color:#50483e}.tagline{display:flex;gap:8px;flex-wrap:wrap;margin-top:29px}.tag{border:0;border-radius:7px;padding:7px 11px;background:#f3ede3;color:#866c50;font-size:12px;cursor:pointer}.tag:hover{background:#e9dbc7}.related{border-top:1px solid #eee8df;margin-top:28px;padding-top:17px;color:#9a8e7e;font-size:13px}.related a{color:#886c4d;margin-right:12px}.empty{padding:35px;color:#998e81;border:1px dashed #ded5c9;border-radius:12px}.note{margin-top:24px;font-size:12px;color:#9b8d7b;line-height:1.8}.note code{background:#ebe5da;padding:2px 5px;border-radius:4px}.form-field{display:block;width:100%;font:14px/1.6 inherit;border:1px solid #e4dccc;border-radius:8px;padding:10px;margin:6px 0 15px;color:#433d34;background:#fffdfa}textarea.form-field{min-height:90px;resize:vertical;font-family:inherit}.form-actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#37312a;color:white;border:0;border-radius:20px;padding:10px 17px;cursor:pointer}.secondary{background:#eee8de;color:#554a3d;border:0;border-radius:20px;padding:10px 17px;cursor:pointer}.status{font-size:12px;color:#8c806e;margin-top:12px}.hidden{display:none}@media(max-width:700px){header{height:74px}.brand{font-size:27px}.brand small{font-size:10px;margin-left:7px}main{padding:35px 18px}.top{display:block}h1{font-size:36px}.search{margin-top:23px;width:100%}.layout{grid-template-columns:1fr;gap:25px}.sidebar{border-right:0;border-bottom:1px solid #e6e0d5;padding:0 0 15px}.sidebar-note{display:none}.filters{display:flex;flex-wrap:wrap;gap:5px}.filter{width:auto}.filter span{margin-left:8px}.card{padding:25px 23px}.card h3{font-size:25px}}
</style>
</head>
<body>
<header><div class="brand">Yu. <small>LIBRARY CARDS</small></div><span class="small">A personal knowledge map · v0.1</span></header>
<main><div class="top"><div><h1>My Card Box <span style="color:#c7b59c">↗</span></h1><p class="sub">个人切片 · 随时抽取，重新接上已经建立的能力。</p></div><input class="search" id="search" placeholder="⌕  搜索卡片 / 标签" aria-label="搜索卡片"></div>
<div class="layout"><aside class="sidebar"><p class="eyebrow">Drawers · 抽屉</p><div class="filters" id="filters"></div><p class="sidebar-note">A card is a re-entry point into something I can already do.</p></aside><section class="workspace"><div class="workspace-head"><h2>Cards <span id="count" class="small"></span></h2><span class="small">One card at a time ✳</span></div><div id="cards"></div><p class="note">编辑卡片：点击「编辑」后可修改并下载更新后的 <code>cards.js</code>，替换原文件后再 Git push。也可以直接用 Terminal 修改 <code>cards.js</code>。网页编辑不会自动写回 GitHub。</p></section></div></main>
<script src="cards.js"></script>
<script>
let current='全部',editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function jsSource(){return '// 你的卡片库。复制一个对象即可添加新卡。\nconst CARDS = '+JSON.stringify(CARDS,null,2)+';\n'}
function download(){const blob=new Blob([jsSource()],{type:'text/javascript;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cards.js';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){const drawers=['全部',...new Set(CARDS.map(c=>c.drawer))];$('filters').innerHTML=drawers.map(d=>`<button class="filter ${d===current?'active':''}" data-drawer="${esc(d)}">${esc(d)} <span>${d==='全部'?CARDS.length:CARDS.filter(c=>c.drawer===d).length}</span></button>`).join('');const q=$('search').value.trim().toLowerCase();const shown=CARDS.filter(c=>(current==='全部'||c.drawer===current)&&[c.id,c.title,c.trigger,c.action,c.drawer,...c.tags].join(' ').toLowerCase().includes(q));$('count').textContent=`(${shown.length})`;$('cards').innerHTML=shown.map(c=>editing===c.id?editor(c):card(c)).join('')||'<div class="empty">这里还没有卡片。换个关键词试试。</div>'}
function card(c){const related=c.links.map(id=>CARDS.find(x=>x.id===id)).filter(Boolean);return `<article class="card" id="card-${esc(c.id)}"><div class="card-top"><span class="number">CARD ${esc(c.id)} · ${esc(c.drawer)}</span><button class="edit" data-edit="${esc(c.id)}">✎ 编辑</button></div><h3>${esc(c.title)}</h3><div class="field-label">触发场景</div><p class="field-text">${esc(c.trigger)}</p><div class="field-label">可调用行为</div><p class="field-text">${esc(c.action)}</p><div class="tagline">${c.tags.map(t=>`<button class="tag" data-search="${esc(t)}">#${esc(t)}</button>`).join('')}</div><div class="related">↗ 关联卡片 ${related.length?related.map(x=>`<a href="#card-${esc(x.id)}" data-related="${esc(x.id)}">${esc(x.title)}</a>`).join(''):'· 等待下一张卡长出来'}</div></article>`}
function editor(c){return `<article class="card"><div class="number">EDITING · ${esc(c.id)}</div><label class="field-label">标题<input class="form-field" id="e-title" value="${esc(c.title)}"></label><label class="field-label">抽屉<input class="form-field" id="e-drawer" value="${esc(c.drawer)}"></label><label class="field-label">触发场景<textarea class="form-field" id="e-trigger">${esc(c.trigger)}</textarea></label><label class="field-label">可调用行为<textarea class="form-field" id="e-action">${esc(c.action)}</textarea></label><label class="field-label">标签（用逗号分隔）<input class="form-field" id="e-tags" value="${esc(c.tags.join(', '))}"></label><label class="field-label">关联卡片 ID（用逗号分隔，可留空）<input class="form-field" id="e-links" value="${esc(c.links.join(', '))}"></label><div class="form-actions"><button class="primary" data-save="${esc(c.id)}">保存并下载 cards.js</button><button class="secondary" data-cancel="1">取消</button></div><p class="status">保存会更新当前页面并下载文件。要永久保留，请用下载的 cards.js 替换原文件。</p></article>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.drawer!==undefined){current=b.dataset.drawer;editing=null;render()}else if(b.dataset.search!==undefined){current='全部';$('search').value=b.dataset.search;editing=null;render()}else if(b.dataset.edit!==undefined){editing=b.dataset.edit;render()}else if(b.dataset.cancel){editing=null;render()}else if(b.dataset.related){current='全部';$('search').value='';editing=null;render();document.getElementById('card-'+b.dataset.related)?.scrollIntoView({behavior:'smooth'})}else if(b.dataset.save!==undefined){const c=CARDS.find(x=>x.id===b.dataset.save);if(!c)return;c.title=$('e-title').value.trim()||c.title;c.drawer=$('e-drawer').value.trim()||'未分类';c.trigger=$('e-trigger').value;c.action=$('e-action').value;c.tags=$('e-tags').value.split(',').map(x=>x.trim()).filter(Boolean);c.links=$('e-links').value.split(',').map(x=>x.trim()).filter(Boolean);editing=null;render();download()}});$('search').addEventListener('input',()=>{editing=null;render()});render();
</script>
</body></html>
